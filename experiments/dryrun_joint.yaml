name: dryrun_joint
experiment: E7_joint
mode: open_loop
warmup_s: 0
measure_s: 2
repetitions: 1
interleave: true
replay_traces: true
queue_max: 8
queue_timeout_s: 1.0
c_global: 2
tenants:
  A:
    c_max: 2
    classes: {short: 2, long: 1}
  B:
    c_max: 1
    classes: {short: 1, long: 1}
class_caps:
  short: 2
  long: 1
slo:
  short: 576
  long: 769
policies:
  - {name: tenant_only, policy: token_slo_aimd, c: 2, caps: [global, tenant]}
  - {name: class_only, policy: token_slo_aimd, c: 2, caps: [global, class]}
  - {name: hierarchical, policy: token_slo_aimd, c: 2, caps: [global, tenant, class]}
phases:
  - until_s: 1
    tenants:
      A: {rps: 2, mix: {short: 1.0, long: 0.0}}
      B: {rps: 0}
  - until_s: 2
    tenants:
      A: {rps: 2, mix: {short: 0.8, long: 0.2}}
      B: {rps: 1, mix: {short: 0.5, long: 0.5}}
