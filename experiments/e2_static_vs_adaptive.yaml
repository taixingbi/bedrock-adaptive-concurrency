name: e2_light_load
experiment: E2
mode: open_loop
# Light-load sanity for revised SLO-AIMD. Not a policy ranking.
# Expect: goodput/TTFT ≈ Fixed-1, 0 Bedrock 429, adaptive C stays 1–2.
rps_frac: 0.5
workload:
  prompt_class: short
  input_tokens: 512
  max_tokens: 128
warmup_s: 60
measure_s: 180
repetitions: 5
queue_max: 16
queue_timeout_s: 2.0
cells:
  - {name: fixed_1, policy: fixed, c: 1}
  - {name: fixed_2, policy: fixed, c: 2}
  - {name: slo_aimd, policy: slo_aimd, c: 1}
