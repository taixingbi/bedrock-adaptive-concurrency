name: e3_dynamic_load_v2
experiment: E3
mode: open_loop
# Main paper rerun. Revised SLO-AIMD vs Fixed-1 vs Gradient.
warmup_s: 0
measure_s: 420
repetitions: 5
queue_max: 16
queue_timeout_s: 2.0
workload:
  prompt_class: short
  input_tokens: 512
  max_tokens: 128
policies: [fixed, gradient, slo_aimd]
phases:
  - {until_s: 120, rps_frac: 0.5, prompt_class: short}
  - {until_s: 240, rps_frac: 0.9, prompt_class: short}
  - {until_s: 300, rps_frac: 1.5, prompt_class: short}
  - {until_s: 420, rps_frac: 0.6, prompt_class: short}
