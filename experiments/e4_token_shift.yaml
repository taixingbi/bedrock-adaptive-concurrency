name: e4_token_shift_v2
experiment: E4
mode: open_loop
rps_frac: 0.9
# Constant RPS. Decide if token-aware stays a core novelty (>~10% + better recovery).
warmup_s: 0
measure_s: 480
repetitions: 5
queue_max: 16
queue_timeout_s: 2.0
workload:
  prompt_class: short
policies:
  - slo_aimd
  - token_slo_aimd
phases:
  - {until_s: 180, rps_frac: 0.9, prompt_class: short}
  - {until_s: 300, rps_frac: 0.9, prompt_class: long}
  - {until_s: 480, rps_frac: 0.9, prompt_class: short}
