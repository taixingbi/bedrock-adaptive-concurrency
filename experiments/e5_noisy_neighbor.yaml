name: e5_noisy_neighbor
experiment: E5_noisy
mode: open_loop
warmup_s: 0
measure_s: 420
repetitions: 5
queue_max: 16
queue_timeout_s: 2.0
c_global: 2
tenants:
  A:
    class: short
    c_max: 2
    ttft_slo_ms: 576
  B:
    class: long
    c_max: 1
    ttft_slo_ms: 3000
class_caps:
  short: 2
  long: 1
policies:
  - {name: global_fixed, policy: fixed, c: 2, caps: [global]}
  - {name: global_slo_aimd, policy: slo_aimd, c: 2, caps: [global]}
  - {name: global_token, policy: token_slo_aimd, c: 2, caps: [global]}
  - {name: tenant_only, policy: tenant_admit, c: 2, caps: [global, tenant]}
  - {name: class_only, policy: tenant_admit, c: 2, caps: [global, class]}
  - {name: tenant_class, policy: tenant_admit, c: 2, caps: [global, tenant, class]}
phases:
  - until_s: 120
    tenants:
      A: {rps_frac: 0.5, prompt_class: short}
      B: {rps: 0}
  - until_s: 300
    tenants:
      A: {rps_frac: 0.5, prompt_class: short}
      B: {rps_frac: 0.9, prompt_class: long}
  - until_s: 420
    tenants:
      A: {rps_frac: 0.5, prompt_class: short}
      B: {rps: 0}
