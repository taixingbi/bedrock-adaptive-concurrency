name: e6_mixed_class
experiment: E6_mixed
mode: open_loop
warmup_s: 0
measure_s: 420
repetitions: 5
queue_max: 16
queue_timeout_s: 2.0
c_global: 2
tenant:
  id: A
  c_max: 2
class_caps:
  short: 2
  long: 1
slo:
  short: 576
  long: 3000
policies:
  - {name: tenant_only, policy: tenant_admit, c: 2, caps: [global, tenant]}
  - {name: tenant_class, policy: tenant_admit, c: 2, caps: [global, tenant, class]}
  - {name: global_token, policy: token_slo_aimd, c: 2, caps: [global]}
phases:
  - until_s: 120
    rps_frac: 0.5
    mix: {short: 1.0, long: 0.0}
  - until_s: 300
    rps_frac: 0.9
    mix: {short: 0.7, long: 0.3}
  - until_s: 420
    rps_frac: 0.5
    mix: {short: 1.0, long: 0.0}
